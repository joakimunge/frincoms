name: Build Linux app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test Linux app
        run: bash build-linux.sh

      - name: Verify bundle
        run: test -x dist-linux/Frincoms/Frincoms && test -d dist-linux/Frincoms/_internal

      - name: Package complete bundle
        run: tar -C dist-linux -czf Frincoms-Linux-x64.tar.gz Frincoms

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: Frincoms-Linux-x64
          path: Frincoms-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
